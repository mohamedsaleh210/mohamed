<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
<!--
  Sanad admin icon sprite — Phase 2 V3 integration.
  Self-authored outline set, 1.75px stroke, round caps/joins, 24x24 viewBox.
  Extends the identical set approved in design/sanad-phase1-preview
  (design-preview/assets/icons.svg) with two icons the real app's module
  list needs that the preview didn't cover: i-refresh (renewals /
  status-change notifications) and i-map-pin (errands). Replaces the
  Unicode-glyph/emoji icons previously inline in admin_nav.ejs and
  dashboard.ejs — see design-preview/README.md and the Phase 2 report for
  the full icon-mapping rationale.
-->

